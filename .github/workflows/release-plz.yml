name: Release-plz

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  # Publishes versions that are not on crates.io yet. crates.io only accepts
  # trusted publishing for crates that exist, so the first version is
  # published with the `CARGO_REGISTRY_TOKEN` secret of the `crates-io`
  # environment.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    environment: crates-io
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    permissions:
      contents: write # Required to create tags and GitHub releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Run release-plz
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the PR that bumps the version and the changelog for the
  # next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    permissions:
      contents: write # Required to push the release branch
      pull-requests: write # Required to open and update the PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Run release-plz
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
