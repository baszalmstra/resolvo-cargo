[package]
name = "resolvo-cargo-corpus"
description = "Compares resolvo-cargo with cargo's resolver, solutions and timings, on crates.io packages as roots"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

# Kept out of the library's dependency graph: cargo as a library is large.
[workspace]

[dependencies]
anyhow = "1"
cargo = "=0.96.0"
rayon = "1"
resolvo-cargo = { path = ".." }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[profile.release]
debug = "line-tables-only"
