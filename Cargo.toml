[package]
name = "resolvo-cargo"
description = "Generate and update Cargo.lock without cargo, with a resolvo-based resolver"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/baszalmstra/resolvo-cargo"
readme = "README.md"
keywords = ["cargo", "lockfile", "resolver", "resolvo", "dependencies"]
categories = ["development-tools", "development-tools::cargo-plugins"]
exclude = [
    "/.github",
    "/corpus",
    "/pixi.lock",
    "/pixi.toml",
    "/release-plz.toml",
    "/rust-toolchain.toml",
]

[dependencies]
cargo-platform = "0.3"
futures = "0.3"
glob = "0.3"
miette = "7"
petgraph = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
resolvo = "0.12"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync"] }
toml = "1"
tracing = "0.1"
url = "2"

[dev-dependencies]
anyhow = "1"
insta = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
panic = "warn"
unreachable = "warn"
allow_attributes = "warn"

# The solver and JSON parsing dominate a resolve; unoptimized they take
# seconds on a workspace of a few hundred packages.
[profile.dev.package."*"]
opt-level = 1
